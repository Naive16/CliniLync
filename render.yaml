# CLINILYNC staging only. This Blueprint does not deploy production resources.
# Secret values are intentionally omitted and must be entered in Render.

services:
  - type: web
    name: clinilync-api-staging
    runtime: node
    region: frankfurt
    plan: free
    autoDeploy: false
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: clinilync-postgres-staging
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DB_MAX_CONNECTIONS
        value: "10"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_EXPIRY_SECONDS
        value: "86400"
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_DEMO_SEED
        value: "false"

databases:
  - name: clinilync-postgres-staging
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: clinilync_staging
    user: clinilync_staging
    ipAllowList: []
