name = "clinilync-staging"
main = "worker.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "staging"

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

# Required before deployment. Create a Hyperdrive configuration against the
# existing Supabase PostgreSQL database using a dedicated Worker DB role and
# DISABLE Hyperdrive query caching (clinical records, sessions, permissions,
# and billing state must always be read fresh). Use `wrangler hyperdrive create
# clinilync-staging --connection-string='<PRIVATE_CONNECTION_STRING>' --caching-disabled`.
# Never place the database password in this file or source control.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<create-and-configure-this-in-cloudflare>"

# Set these as Worker secrets/vars, not in source control:
# SESSION_SECRET (secret; >=32 chars)
# APP_URL (var; https://clinilync-staging.kelvinmkanda01.workers.dev)
# CORS_ORIGINS (var; comma-separated allowed origins)
# EMAIL_FROM (var; required by existing hosted config policy)
