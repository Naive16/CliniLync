name = "clinilync-staging"
main = "worker.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "staging"

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

# Existing Supabase PostgreSQL database. Hyperdrive credentials are stored
# securely in Cloudflare and are intentionally not present in this file.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "14656e8e20ec4b978b6c245769d4062e"

# Set these as Worker secrets/vars, not in source control:
# SESSION_SECRET (secret; >=32 chars)
# APP_URL (var; https://clinilync-staging.kelvinmkanda01.workers.dev)
# CORS_ORIGINS (var; comma-separated allowed origins)
# EMAIL_FROM (var; required by existing hosted config policy)
