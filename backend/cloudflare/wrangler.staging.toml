name = "clinilync-staging"
main = "worker.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "staging"
APP_URL = "https://clinilync-staging.kelvinmkanda01.workers.dev"
CORS_ORIGINS = "https://clinilync-staging.kelvinmkanda01.workers.dev"

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

# Existing Supabase PostgreSQL database. Hyperdrive credentials are stored
# securely in Cloudflare and are intentionally not present in this file.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "14656e8e20ec4b978b6c245769d4062e"

# Set these as Worker secrets/vars, not in source control:
# SESSION_SECRET (secret; >=32 chars)
# EMAIL_FROM (set only to a verified sender address when email delivery is configured)
# RESEND_API_KEY or EMAIL_WEBHOOK_URL only when an email provider is approved.
