name = "clinilync-staging"
main = "worker.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "staging"

[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]

# Required before deployment. Use the existing server-only `clinilync_app`
# PostgreSQL login only after its privileges and credential have been reviewed
# for this Worker. This role currently has BYPASSRLS; preserve migration 017's
# security model and do not create another privileged role or broaden grants.
# Use Supabase's direct database endpoint and disable Hyperdrive query caching
# for clinical, session, permission, and billing data. Enter the connection
# string only in Cloudflare's secure Hyperdrive workflow, never in this file.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<create-and-configure-this-in-cloudflare>"

# Set these as Worker secrets/vars, not in source control:
# SESSION_SECRET (secret; >=32 chars)
# APP_URL (var; https://clinilync-staging.kelvinmkanda01.workers.dev)
# CORS_ORIGINS (var; comma-separated allowed origins)
# EMAIL_FROM (var; required by existing hosted config policy)
