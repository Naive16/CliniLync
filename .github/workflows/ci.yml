name: CLINILYNC CI

on:
  push:
    branches: [main, master, develop, migration/cloudflare-workers-staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install

      - name: Type check (TypeScript)
        run: bun run lint

      - name: Execute security and architectural tests
        run: bun run test

      - name: Build frontend distribution
        run: bun run build

      - name: Validate Cloudflare Worker bundle (dry run)
        run: bunx wrangler@4 deploy --dry-run --outdir /tmp/clinilync-worker-dry-run --config backend/cloudflare/wrangler.staging.toml
